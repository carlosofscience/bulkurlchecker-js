name: Publish to npm

# BOOTSTRAP MODE: uses NPM_TOKEN to land the first publish of
# `bulkurlchecker` so we can configure npm Trusted Publishers
# (which requires the package to already exist). Once that's
# done, this workflow will be swapped back to pure OIDC and
# the NPM_TOKEN secret removed.
#
# Triggered by pushing a version tag (e.g. v0.1.0).

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/bulkurlchecker
    permissions:
      contents: read
      id-token: write   # sigstore provenance attestation

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Publish (with provenance)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
