name: Publish to npm

# Triggered by pushing a version tag (e.g. v0.1.0).
#
# Uses npm Trusted Publishers (OIDC) -- no NPM_TOKEN required.
# Configure on npmjs.com side at
# https://www.npmjs.com/package/bulkurlchecker/access (after the
# package exists) or via the pre-publish trusted publisher form:
#   Package:     bulkurlchecker
#   Owner:       carlosofscience
#   Repo:        bulkurlchecker-js
#   Workflow:    publish.yml
#   Environment: npm
#
# The 'npm' GitHub environment in this repo (Settings -> Environments)
# controls who can deploy -- restrict to v*.*.* tags and require a
# manual reviewer for added safety.

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/bulkurlchecker
    permissions:
      contents: read
      id-token: write   # OIDC for npm trusted publishing + sigstore provenance

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Publish (trusted publishing + provenance)
        run: npm publish --provenance --access public
