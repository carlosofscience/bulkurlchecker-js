name: Publish to npm

# Triggered by pushing a version tag (e.g. v0.1.1).
#
# Uses npm Trusted Publishers (OIDC) -- no NPM_TOKEN required.
# Configured on the npm side at
# https://www.npmjs.com/package/bulkurlchecker/access
#   Package:     bulkurlchecker
#   Owner:       carlosofscience
#   Repo:        bulkurlchecker-js
#   Workflow:    publish.yml
#   Environment: npm
#   Allowed:     Publish (only)
#
# The 'npm' GitHub environment in this repo controls who can deploy --
# restricted to v*.*.* tags with a required reviewer for added safety.

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/bulkurlchecker
    permissions:
      contents: read
      id-token: write   # OIDC for npm trusted publishing + sigstore provenance

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # Node 20 LTS ships with npm 10.x; npm Trusted Publishers OIDC
      # requires npm 11.5.1+. Without this upgrade, `npm publish` falls
      # back to token auth and returns 404 "not in this registry" on
      # PUT because there's no token in the env to fall back to.
      - name: Upgrade npm for Trusted Publisher OIDC support
        run: npm install -g npm@latest

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Publish (trusted publishing + provenance)
        run: npm publish --provenance --access public
